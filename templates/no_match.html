<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>No Match Found | AI Skill Exchange</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    margin:0;
    padding:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2563eb,#0ea5e9);
    font-family:Segoe UI,sans-serif;
}

.card-box{
    width:700px;
    background:white;
    border-radius:20px;
    text-align:center;
    padding:50px;
    box-shadow:0 20px 45px rgba(0,0,0,.25);
}

.icon{
    font-size:90px;
    color:#f59e0b;
}

h1{
    margin-top:20px;
    font-weight:bold;
}

p{
    color:#666;
    font-size:18px;
}

.btn-custom{
    margin:10px;
    width:180px;
    border-radius:12px;
    font-weight:bold;
}

.footer-text{
    margin-top:25px;
    color:#999;
    font-size:14px;
}

</style>

</head>

<body>

<div class="card-box">

<i class="fas fa-user-slash icon"></i>

<h1>No Match Found</h1>

<p>
Sorry! We couldn't find any learners matching your preferences.
</p>

<p>
Try changing your skill, language, learning mode, or availability and search again.
</p>

<div class="mt-4">

<a href="/form" class="btn btn-primary btn-custom">
<i class="fas fa-search"></i>
 Find Another Match
</a>

<a href="/dashboard" class="btn btn-success btn-custom">
<i class="fas fa-home"></i>
 Dashboard
</a>

<a href="/" class="btn btn-secondary btn-custom">
<i class="fas fa-house"></i>
 Home
</a>

<a href="/logout" class="btn btn-danger btn-custom">
<i class="fas fa-right-from-bracket"></i>
 Logout
</a>

</div>

<div class="footer-text">
AI Skill Exchange Recommendation System
</div>

</div>

</body>
</html>
