<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Register | AI Skill Exchange</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body{

            height:100vh;

            background:linear-gradient(135deg,#2563eb,#0ea5e9);

            display:flex;

            justify-content:center;

            align-items:center;

            font-family:Segoe UI;

        }

        .register-card{

            width:900px;

            background:white;

            border-radius:20px;

            overflow:hidden;

            box-shadow:0 15px 40px rgba(0,0,0,.2);

        }

        .left{

            background:#2563eb;

            color:white;

            display:flex;

            flex-direction:column;

            justify-content:center;

            align-items:center;

            padding:40px;

        }

        .left img{

            width:280px;

        }

        .right{

            padding:40px;

        }

        h2{

            font-weight:bold;

        }

        .form-control{

            border-radius:10px;

        }

        .btn-register{

            width:100%;

            border-radius:10px;

            background:#2563eb;

            color:white;

            font-weight:bold;

        }

        .btn-register:hover{

            background:#174dc9;

        }

    </style>

</head>

<body>

<div class="register-card">

<div class="row g-0">

<div class="col-md-5 left">

<img src="https://undraw.co/api/illustrations/undraw_programming_re_kg9v.svg">

<h3 class="mt-4">AI Skill Exchange</h3>

<p class="text-center">

Learn • Teach • Grow Together

</p>

</div>

<div class="col-md-7 right">

<h2>Create Account</h2>

<p class="text-muted">

Join our AI-powered learning community

</p>

<form action="/register" method="POST">

<div class="mb-3">

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Confirm Password</label>

<input
type="password"
name="confirm_password"
class="form-control"
required>

</div>

<button class="btn btn-register">

<i class="fa-solid fa-user-plus"></i>

Create Account

</button>

</form>

<hr>

<p class="text-center">

Already have an account?

<a href="/login">

Login

</a>

</p>

</div>

</div>

</div>

</body>

</html>
